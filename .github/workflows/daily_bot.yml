name: BTC ETF Strategy Daily Telegram Bot

on:
  schedule:
    # 避开 UTC 00:00 - 00:30 全球高峰拥堵期
    # cron 1: 北京时间 08:45 AM 自动运行
    - cron: '45 0 * * *'
    # cron 2: 北京时间 09:15 AM 补充轮询 (确保美股闭市及 Farside 数据已完全入库)
    - cron: '15 1 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页界面随时手动点击运行测试

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GitHub Actions 自动提交更新持仓状态 json 文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Strategy Bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
        run: |
          python bot.py

      - name: Commit and push updated position state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json etf_cache.json
          git diff --cached --quiet || (git commit -m "Auto-update state and cache [skip ci]" && git push)
