name: BTC ETF Strategy Daily Telegram Bot

on:
  schedule:
    # cron 1: 北京时间 09:11 AM (UTC 01:11) 自动运行 (使用奇数分钟避开 GitHub 整点拥堵)
    - cron: '11 1 * * *'
    # cron 2: 北京时间 09:43 AM (UTC 01:43) 补充轮询 (使用奇数分钟避开 GitHub 半点拥堵)
    - cron: '43 1 * * 1-5'
  workflow_dispatch: # 支持在 GitHub 网页界面随时手动点击运行测试
  repository_dispatch:
    types: [trigger-daily-bot] # 支持通过外部稳定 Cron 服务（如 cron-job.org）精确触发


jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GitHub Actions 自动提交更新持仓状态 json 文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Clash Proxy
        run: |
          wget -q https://github.com/MetaCubeX/mihomo/releases/download/v1.18.2/mihomo-linux-amd64-v1.18.2.gz -O clash.gz
          gzip -d clash.gz
          chmod +x clash
          cat << 'EOF' > config.yaml
          mixed-port: 7890
          allow-lan: true
          mode: global
          proxy-providers:
            free-nodes:
              type: http
              url: "https://raw.githubusercontent.com/uykb/clash-proxy-cleaner/main/subscribe.yaml"
              interval: 3600
              path: ./free-nodes.yaml
              health-check:
                enable: true
                interval: 600
                url: http://www.gstatic.com/generate_204
          proxy-groups:
            - name: GLOBAL
              type: url-test
              proxies: []
              use:
                - free-nodes
              url: 'http://www.gstatic.com/generate_204'
              interval: 300
          EOF
          ./clash -d . -f config.yaml > clash.log 2>&1 &
          echo "Waiting for Clash to download nodes and start..."
          sleep 15
          curl -s -x http://127.0.0.1:7890 http://www.gstatic.com/generate_204 || echo "Proxy check failed"

      - name: Run Daily Strategy Bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HYPERLIQUID_WALLET: ${{ secrets.HYPERLIQUID_WALLET }}
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
        run: |
          python bot.py

      - name: Commit and push updated position state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json etf_cache.json
          git diff --cached --quiet || (git commit -m "Auto-update state and cache [skip ci]" && git push)
