name: BTC ETF Strategy Daily Telegram Bot

on:
  schedule:
    # 每天 UTC 时间 00:30 自动运行 (对应北京时间 08:30 AM，美股收盘且 Farside ETF 数据已更新)
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页界面随时手动点击运行测试

jobs:
  run-daily-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GitHub Actions 自动提交更新持仓状态 json 文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Strategy Bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python bot.py

      - name: Commit and push updated position state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_state.json
          git diff-index --quiet HEAD || (git commit -m "Auto-update trade_state.json [skip ci]" && git push)
